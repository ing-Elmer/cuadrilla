# Validates the marketplace on every push/PR: repository self-check (JSON, frontmatter,
# component.json, YAML, hook tests) and `claude plugin validate` for every plugin.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Self-check (JSON, frontmatter, packs, YAML, hook tests)
        run: node scripts/check.mjs

      - name: claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for dir in plugins/*/; do claude plugin validate "$dir"; done
