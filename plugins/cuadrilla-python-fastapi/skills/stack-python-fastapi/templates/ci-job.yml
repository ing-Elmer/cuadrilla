  # cuadrilla — python-fastapi component job. Goes under `jobs:` in .github/workflows/ci.yml.
  # Placeholders: <name> (component name), <path> (component folder).
  # Toolchain: the Python version comes from <path>/.python-version (uv installs it); uv itself
  # comes from setup-uv below. Steps mirror component.json: setup, then every check in order.
  ci-<name>:
    name: ci-<name>
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: <path>
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: <path>
          enable-cache: true

      - name: Install Python and dependencies (from uv.lock)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run mypy

      - name: Layer contracts
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest
