# CI generated by /cuadrilla:adopt from .claude/cuadrilla.json.
# One job per component (ci-<name>) running its `setup` and `checks` in the same order as
# /cuadrilla:verify. If you change one, change the other in the same PR.
# Branch protection and deploy platforms require these job names: renaming a job means updating
# those settings too.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Some platforms ("Wait for CI") need a push trigger on the branch they deploy.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # <one job per component, from each pack's templates/ci-job.yml>
