# Keep one "updates" entry per ecosystem the project uses, plus github-actions.
# Ecosystems: pip / uv, npm, nuget, maven, gradle, gomod, cargo, composer, bundler, docker.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "<ecosystem>"
    directory: "/<component path>"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
