  # cuadrilla .NET component job. Placeholders: <name> (component name), <path> (component folder).
  # The SDK version is pinned in <path>/global.json (toolchain placeholder) and read by setup-dotnet.
  # Steps mirror .claude/cuadrilla.json: setup, then every checks[].run in the same order.
  ci-<name>:
    name: ci-<name>
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: <path>
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: <path>/global.json
          # NuGet cache keyed on lock files. Remove both lines if the repo has no packages.lock.json.
          cache: true
          cache-dependency-path: <path>/**/packages.lock.json

      - name: setup
        run: dotnet restore --locked-mode

      - name: build
        run: dotnet build --no-restore -warnaserror

      - name: format
        run: dotnet format --verify-no-changes --no-restore

      - name: test
        run: dotnet test --no-build
