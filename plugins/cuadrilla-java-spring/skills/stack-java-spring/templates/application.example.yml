# Base src/main/resources/application.yml for a cuadrilla java-spring component.
# No secret values: every credential is an environment variable without a default, so a missing
# value fails at startup. Replace <app> with the property prefix from the project profile and the
# variable names with the ones the profile declares. Commit a .env.example with fake values.
spring:
  application:
    name: <app>
  config:
    # Local development only: a git-ignored .env file (KEY=value). Absent in containers.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jdbc:
    template:
      query-timeout: 30            # seconds; no unbounded statements
  flyway:
    # Migrations are run by a person or the pipeline the profile declares, never by Claude.
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false               # errors always use the ApiResponse envelope
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:false}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info       # only health is public in the security chain
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

<app>:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}          # comma-separated explicit origins
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
      secret: ${JWT_SECRET}                           # base64, >= 32 bytes; only for self-issued HS256
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:14d}

logging:
  level:
    root: INFO
